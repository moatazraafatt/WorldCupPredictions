<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="trophy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WC2026 — Register</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light" ? t : "light";
      } catch (e) {}
    </script>
  </head>
  <body class="auth-page">
    <div id="global-spinner" style="display: none">
      <div class="spinner"></div>
    </div>

    <div class="auth-container">
      <img class="auth-logo" src="trophy.png" alt="World Cup Trophy" />
      <h1 class="auth-title">World Cup 2026</h1>
      <p class="auth-sub">Create your account</p>

      <form id="register-form" class="auth-form">
        <h2>Register</h2>
        <div class="form-group">
          <label for="displayName">Display Name</label>
          <input
            type="text"
            id="displayName"
            class="input"
            required
            maxlength="30"
            autocomplete="nickname"
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            class="input"
            required
            autocomplete="email"
          />
        </div>
        <div class="form-group">
          <label for="password"
            >Password <span class="hint">(min 6 chars)</span></label
          >
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              class="input"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              id="toggle-password"
              aria-label="Show password"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirm-password"
              class="input"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button type="button" class="password-toggle" id="toggle-confirm-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="reg-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">
          Create Account
        </button>
        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </form>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
      import { register, getCurrentUser } from "./auth.js";
      import { setLoading } from "./ui.js";

      getCurrentUser().then((user) => {
        if (user) location.href = "index.html";
      });

      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("displayName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirm-password").value;
          const errEl = document.getElementById("reg-error");
          errEl.classList.add("hidden");

          if (password !== confirmPassword) {
            errEl.textContent = "Passwords do not match.";
            errEl.classList.remove("hidden");
            return;
          }

          setLoading(true);
          try {
            // Creates Firebase Auth account + Firestore user document
            await register(email, password, name);
            location.href = "index.html";
          } catch (err) {
            errEl.textContent = friendlyError(err.code);
            errEl.classList.remove("hidden");
          } finally {
            setLoading(false);
          }
        });

      function makeToggle(inputId, btnId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const pwd = document.getElementById(inputId);
          const btn = document.getElementById(btnId);
          const show = pwd.type === "password";
          pwd.type = show ? "text" : "password";
          btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
          btn.innerHTML = show
            ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }

      makeToggle("password", "toggle-password");
      makeToggle("confirm-password", "toggle-confirm-password");

      function friendlyError(code) {
        const map = {
          "auth/email-already-in-use": "This email is already registered.",
          "auth/invalid-email": "Invalid email address.",
          "auth/weak-password": "Password must be at least 6 characters.",
        };
        return map[code] || "Registration failed. Please try again.";
      }
    </script>
  </body>
</html>
