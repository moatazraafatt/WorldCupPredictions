<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="trophy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WC2026 — Sign In</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light" ? t : "light";
      } catch (e) {}
    </script>
  </head>
  <body class="auth-page">
    <div id="global-spinner" style="display: none">
      <div class="spinner"></div>
    </div>

    <div class="auth-container">
      <img class="auth-logo" src="trophy.png" alt="World Cup Trophy" />
      <h1 class="auth-title">World Cup 2026</h1>
      <br />
      <form id="login-form" class="auth-form">
        <h2>Sign In</h2>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            class="input"
            required
            autocomplete="email"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              class="input"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              id="toggle-password"
              aria-label="Show password"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        <p class="auth-switch">
          Don't have an account? <a href="register.html">Register</a>
        </p>
      </form>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
      import { login, getCurrentUser } from "./auth.js";
      import { setLoading, showToast } from "./ui.js";

      // Redirect if already logged in
      getCurrentUser().then((user) => {
        if (user) location.href = "index.html";
      });

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const errEl = document.getElementById("login-error");
          errEl.classList.add("hidden");

          setLoading(true);
          try {
            // Firebase Auth: sign in with email/password
            await login(email, password);
            location.href = "index.html";
          } catch (err) {
            errEl.textContent = friendlyError(err.code);
            errEl.classList.remove("hidden");
          } finally {
            setLoading(false);
          }
        });

      document
        .getElementById("toggle-password")
        .addEventListener("click", () => {
          const pwd = document.getElementById("password");
          const btn = document.getElementById("toggle-password");
          const show = pwd.type === "password";
          pwd.type = show ? "text" : "password";
          btn.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password",
          );
          btn.innerHTML = show
            ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });

      function friendlyError(code) {
        const map = {
          "auth/user-not-found": "No account found with this email.",
          "auth/wrong-password": "Incorrect password.",
          "auth/invalid-email": "Invalid email address.",
          "auth/too-many-requests": "Too many attempts. Try again later.",
        };
        return map[code] || "Sign in failed. Please try again.";
      }
    </script>
  </body>
</html>
